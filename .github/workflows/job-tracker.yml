name: RemoteLover scrape

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: remotelover-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The SQLite DB is the memory between runs. Restore the newest one.
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: jobs-db-

      - name: Scrape
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GITHUB_TOKEN_SCRAPER: ${{ secrets.GITHUB_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: GITHUB_TOKEN="$GITHUB_TOKEN_SCRAPER" python run.py

      - name: Save database
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}

      - name: Upload database as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jobs-db
          path: data/jobs.db
          retention-days: 7
          if-no-files-found: ignore
